<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Production deployment handoff flow</title>
  <desc id="description">A three-step flow from upstream release 1.0.90, through reviewed production-only patches, to a verified deployment.</desc>
  <defs>
    <marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .eyebrow { fill: #64748b; font: 600 15px Arial, sans-serif; letter-spacing: 1px; }
      .title { fill: #0f172a; font: 700 25px Arial, sans-serif; }
      .body { fill: #475569; font: 16px Arial, sans-serif; }
      .line { fill: none; marker-end: url(#arrow); stroke: #64748b; stroke-width: 3; }
    </style>
  </defs>
  <rect fill="#f8fafc" height="360" rx="28" width="1200"/>
  <rect class="card" height="190" rx="20" width="300" x="60" y="85"/>
  <text class="eyebrow" x="90" y="125">STEP 1</text>
  <text class="title" x="90" y="165">Upstream release</text>
  <text class="body" x="90" y="205">Commit 42807d9</text>
  <text class="body" x="90" y="235">Version 1.0.90</text>
  <path class="line" d="M380 180H445"/>
  <rect class="card" height="190" rx="20" width="310" x="465" y="85"/>
  <text class="eyebrow" x="495" y="125">STEP 2</text>
  <text class="title" x="495" y="165">Reviewed patches</text>
  <text class="body" x="495" y="205">Storage and permissions</text>
  <text class="body" x="495" y="235">Boundary checks</text>
  <path class="line" d="M795 180H860"/>
  <rect class="card" height="190" rx="20" width="280" x="880" y="85"/>
  <text class="eyebrow" x="910" y="125">STEP 3</text>
  <text class="title" x="910" y="165">Verified deploy</text>
  <text class="body" x="910" y="205">Health and access</text>
  <text class="body" x="910" y="235">Backup and evidence</text>
</svg>
