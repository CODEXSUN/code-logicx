name: ${CODELOGICX_COMPOSE_PROJECT:-codelogicx}

services:
  verify:
    profiles: [tools]
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: verify
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.2}
    image: ${CODELOGICX_IMAGE_REGISTRY:-codelogicx}/verify:${CODELOGICX_IMAGE_TAG:-local}

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    container_name: ${CODELOGICX_MARIADB_CONTAINER_NAME:-codelogicx-mariadb}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks: [codelogicx]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: api-runtime
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.2}
    image: ${CODELOGICX_IMAGE_REGISTRY:-codelogicx}/api:${CODELOGICX_IMAGE_TAG:-local}
    container_name: ${CODELOGICX_API_CONTAINER_NAME:-codelogicx-api}
    init: true
    restart: unless-stopped
    env_file:
      - ${CODELOGICX_RUNTIME_ENV_FILE:-../.env}
    environment:
      DEV_AUTO_LOGIN: "0"
      NODE_ENV: production
      PLATFORM_API_PORT: ${CODELOGICX_API_INTERNAL_PORT:-9150}
      CODELOGICX_ENV_FILE_PATH: /workspace/codelogicx/.env
      CODELOGICX_CODEX_HOME: /var/lib/codelogicx/codex
      CODELOGICX_WORKSPACE_ROOT: /srv/codelogicx/repositories
      CODELOGICX_AGENT_ALLOWED_ROOTS: /srv/codelogicx/repositories
      CODELOGICX_AGENT_WORKTREE_ROOT: /var/lib/codelogicx/worktrees
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${CODELOGICX_BIND_ADDRESS:-127.0.0.1}:${CODELOGICX_API_HOST_PORT:-9150}:${CODELOGICX_API_INTERNAL_PORT:-9150}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CODELOGICX_RUNTIME_ENV_FILE:-../.env}:/workspace/codelogicx/.env:rw
      - codex-state:/var/lib/codelogicx/codex
      - agent-worktrees:/var/lib/codelogicx/worktrees
      - agent-repositories:/srv/codelogicx/repositories
    networks: [codelogicx]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PLATFORM_API_PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 18

  web:
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: web-runtime
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.2}
    image: ${CODELOGICX_IMAGE_REGISTRY:-codelogicx}/web:${CODELOGICX_IMAGE_TAG:-local}
    container_name: ${CODELOGICX_WEB_CONTAINER_NAME:-codelogicx-web}
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: CODELOGICX_API
      CODELOGICX_API_CONTAINER_NAME: ${CODELOGICX_API_CONTAINER_NAME:-codelogicx-api}
      CODELOGICX_API_INTERNAL_PORT: ${CODELOGICX_API_INTERNAL_PORT:-9150}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CODELOGICX_BIND_ADDRESS:-127.0.0.1}:${CODELOGICX_WEB_HOST_PORT:-9160}:80"
    networks: [codelogicx]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

volumes:
  mariadb-data:
    name: ${CODELOGICX_MARIADB_DATA_VOLUME:-codelogicx-mariadb-data}
  codex-state:
    name: ${CODELOGICX_CODEX_STATE_VOLUME:-codelogicx-codex-state}
  agent-worktrees:
    name: ${CODELOGICX_AGENT_WORKTREE_VOLUME:-codelogicx-agent-worktrees}
  agent-repositories:
    name: ${CODELOGICX_AGENT_REPOSITORY_VOLUME:-codelogicx-agent-repositories}

networks:
  codelogicx:
    name: ${CODELOGICX_NETWORK:-codelogicx-network}
    external: ${CODELOGICX_NETWORK_EXTERNAL:-false}
